<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>日历</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="calendar-container">
        <div class="header">
            <button id="exportBtn" class="io-btn">导出</button>
            <button id="prevYear" class="nav-btn">&lt;</button>
            <button id="currentDate" class="io-btn"></button>
            <button id="nextYear" class="nav-btn">&gt;</button>
            <button id="importBtn" class="io-btn">导入</button>
            <input type="file" id="importFile" accept=".json" style="display:none;">
        </div>
        <div class="calendar-body">
            <div class="months" id="months"></div>
        </div>
    </div>

    <div class="emoji-popup" id="emojiPopup">
        <div class="emoji-popup-content">
            <div class="selected-date" id="selectedDate"></div>
            <div class="emoji-section">
                <label>表情</label>
                <div class="emoji-grid" id="emojiGrid"></div>
            </div>
            <div class="comment-section">
                <label>备注</label>
                <textarea id="commentInput" placeholder="添加备注..." rows="18"></textarea>
            </div>
            <div class="popup-btn-row">
                <button id="saveEmojiBtn" class="save-btn">保存</button>
                <button id="deleteEmojiBtn" class="delete-btn">删除</button>
            </div>
            <button class="close-btn" id="closeEmojiPopup">&times;</button>
        </div>
    </div>

    <div class="task-popup" id="taskPopup">
        <div class="task-popup-content">
            <div class="task-popup-header">
                <button class="close-btn" id="closeTaskPopup">&times;</button>
            </div>
            <div class="task-list" id="taskList"></div>
            <button id="addTaskBtn" class="add-task-btn">+ 新建</button>
        </div>
    </div>

    <div class="task-edit-popup" id="taskEditPopup">
        <div class="task-edit-content">
            <div class="task-edit-header">
                <button class="close-btn" id="closeTaskEdit">&times;</button>
            </div>
            <div class="task-edit-form">
                <label>名称</label>
                <input type="text" id="taskNameInput" placeholder="输入名称">
                <label>背景颜色</label>
                <input type="color" id="taskColorInput" value="#4b9cd3">
                <button id="saveTaskBtn" class="save-task-btn">保存</button>
                <button id="deleteTaskBtn" class="delete-task-btn" style="display:none;">删除</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
