<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>日历</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="calendar-container">
        <div class="header">
            <button id="prevYear" class="nav-btn">&lt;</button>
            <h1 id="currentDate"></h1>
            <button id="nextYear" class="nav-btn">&gt;</button>
            <button id="taskBtn" class="task-btn">任务</button>
            <button id="exportBtn" class="io-btn">导出</button>
            <button id="importBtn" class="io-btn">导入</button>
            <input type="file" id="importFile" accept=".json" style="display:none;">
        </div>
        <div class="calendar-body">
            <div class="months" id="months"></div>
        </div>
    </div>

    <div class="emoji-popup" id="emojiPopup">
        <div class="emoji-popup-content">
            <div class="emoji-grid" id="emojiGrid"></div>
            <button class="close-btn" id="closeEmojiPopup">&times;</button>
        </div>
    </div>

    <div class="task-popup" id="taskPopup">
        <div class="task-popup-content">
            <div class="task-popup-header">
                <h2>任务列表</h2>
                <button class="close-btn" id="closeTaskPopup">&times;</button>
            </div>
            <div class="task-list" id="taskList"></div>
            <button id="addTaskBtn" class="add-task-btn">+ 新建任务</button>
        </div>
    </div>

    <div class="task-edit-popup" id="taskEditPopup">
        <div class="task-edit-content">
            <div class="task-edit-header">
                <h2 id="taskEditTitle">新建任务</h2>
                <button class="close-btn" id="closeTaskEdit">&times;</button>
            </div>
            <div class="task-edit-form">
                <label>任务名称</label>
                <input type="text" id="taskNameInput" placeholder="输入任务名称">
                <label>背景颜色</label>
                <input type="color" id="taskColorInput" value="#4b9cd3">
                <button id="saveTaskBtn" class="save-task-btn">保存</button>
            </div>
        </div>
    </div>

    <div class="stats-popup" id="statsPopup">
        <div class="stats-popup-content">
            <div class="stats-popup-header">
                <h2 id="statsTitle">统计</h2>
                <button class="close-btn" id="closeStatsPopup">&times;</button>
            </div>
            <div class="stats-body" id="statsBody"></div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
