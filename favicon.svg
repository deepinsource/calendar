<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'>
  <!-- Calendar body with gradient -->
  <defs>
    <linearGradient id='headerGrad' x1='0%' y1='0%' x2='100%' y2='0%'>
      <stop offset='0%' style='stop-color:%234285f4'/>
      <stop offset='50%' style='stop-color:%2334a853'/>
      <stop offset='100%' style='stop-color:%23fbbc05'/>
    </linearGradient>
  </defs>
  
  <!-- Calendar body -->
  <rect x='10' y='10' width='80' height='80' rx='10' fill='white' stroke='%23e0e0e0' stroke-width='1'/>
  
  <!-- Top colored bar with gradient -->
  <rect x='10' y='10' width='80' height='20' rx='10' fill='url(%23headerGrad)'/>
  <rect x='10' y='22' width='80' height='8' fill='url(%23headerGrad)'/>
  
  <!-- Calendar rings -->
  <rect x='28' y='5' width='8' height='15' rx='4' fill='%23ea4335'/>
  <rect x='64' y='5' width='8' height='15' rx='4' fill='%23ea4335'/>
  
  <!-- Date grid - colorful dots -->
  <rect x='20' y='40' width='14' height='14' rx='3' fill='%234285f4'/>
  <rect x='38' y='40' width='14' height='14' rx='3' fill='%2334a853'/>
  <rect x='56' y='40' width='14' height='14' rx='3' fill='%23fbbc05'/>
  <rect x='74' y='40' width='14' height='14' rx='3' fill='%23ea4335'/>
  
  <rect x='20' y='58' width='14' height='14' rx='3' fill='%23fbbc05'/>
  <rect x='38' y='58' width='14' height='14' rx='3' fill='%23ea4335'/>
  <rect x='56' y='58' width='14' height='14' rx='3' fill='%234285f4'/>
  <rect x='74' y='58' width='14' height='14' rx='3' fill='%2334a853'/>
  
  <rect x='20' y='76' width='14' height='14' rx='3' fill='%2334a853'/>
  <rect x='38' y='76' width='14' height='14' rx='3' fill='%234285f4'/>
  <rect x='56' y='76' width='14' height='14' rx='3' fill='%23fbbc05'/>
