<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'>
  <!-- Calendar body -->
  <rect x='10' y='10' width='80' height='80' rx='8' fill='white'/>
  
  <!-- Top colored bar -->
  <rect x='10' y='10' width='80' height='18' rx='8' fill='%234285f4'/>
  <rect x='10' y='20' width='80' height='8' fill='%234285f4'/>
  
  <!-- Calendar rings -->
  <rect x='28' y='5' width='6' height='15' rx='3' fill='%235f6368'/>
  <rect x='66' y='5' width='6' height='15' rx='3' fill='%235f6368'/>
  
  <!-- Month label -->
  <text x='50' y='42' text-anchor='middle' font-family='Arial' font-size='12' font-weight='bold' fill='%234285f4'>JAN</text>
  
  <!-- Date number -->
  <text x='50' y='72' text-anchor='middle' font-family='Arial' font-size='36' font-weight='bold' fill='%235f6368'>31</text>
</svg>
